<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="upgrade-insecure-requests">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <link rel="canonical" href="https://visuals.immersive.internal/">
  <meta property="og:url" content="https://visuals.immersive.internal/">
  <meta name="robots" content="noindex, nofollow">
  <title>&#9679;</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #000000;
      cursor: crosshair;
    }
    canvas {
      display: block;
      width: 100vw;
      height: 100vh;
      background-color: #000000;
      touch-action: none;
    }
  </style>
</head>
<body>
  <canvas id="stage"></canvas>

  <script>
    (function() {
      const canvas = document.getElementById('stage');
      const ctx = canvas.getContext('2d', { alpha: false });

      let width = 0;
      let height = 0;
      let dpr = 1;

      function resize() {
        dpr = Math.min(window.devicePixelRatio || 1, 2);
        width = window.innerWidth;
        height = window.innerHeight;
        canvas.width = Math.floor(width * dpr);
        canvas.height = Math.floor(height * dpr);
        ctx.scale(dpr, dpr);
      }
      window.addEventListener('resize', resize);
      resize();

      const pointer = {
        x: width * 0.5,
        y: height * 0.5,
        targetX: width * 0.5,
        targetY: height * 0.5,
        isDown: false,
        pulseEnergy: 0
      };

      let time = 0;
      const PARTICLE_COUNT = 900;
      const particles = [];
      const ribbonTendrils = [];
      const RI_COUNT = 32;

      class Particle {
        constructor() {
          this.reset(true);
        }

        reset(init = false) {
          const angle = Math.random() * Math.PI * 2;
          const radius = init ? Math.random() * Math.min(width, height) * 0.45 : Math.random() * 50;
          this.x = width * 0.5 + Math.cos(angle) * radius;
          this.y = height * 0.5 + Math.sin(angle) * radius;
          this.prevX = this.x;
          this.prevY = this.y;
          this.vx = (Math.random() - 0.5) * 1.5;
          this.vy = (Math.random() - 0.5) * 1.5;
          this.life = Math.random() * 0.8 + 0.2;
          this.maxLife = Math.random() * 200 + 200;
          this.age = Math.random() * this.maxLife;
          this.baseHue = Math.random() * 360;
          this.size = Math.random() * 1.8 + 0.6;
          this.speedScale = Math.random() * 1.2 + 0.6;
        }

        update(t, attractorX, attractorY, impulse) {
          this.prevX = this.x;
          this.prevY = this.y;
          this.age++;

          if (this.age >= this.maxLife) {
            this.reset(false);
          }

          const dx = attractorX - this.x;
          const dy = attractorY - this.y;
          const distSq = dx * dx + dy * dy + 800;
          const dist = Math.sqrt(distSq);

          const force = (800 / distSq) * this.speedScale;
          const spin = 1.35;

          this.vx += (dx / dist) * force - (dy / dist) * (force * spin);
          this.vy += (dy / dist) * force + (dx / dist) * (force * spin);

          const curlX = Math.sin(this.y * 0.004 + t * 0.7) * 0.4;
          const curlY = Math.cos(this.x * 0.004 + t * 0.7) * 0.4;

          this.vx += curlX;
          this.vy += curlY;

          if (impulse > 0) {
            const push = (impulse * 12) / (dist * 0.08 + 1);
            this.vx -= (dx / dist) * push;
            this.vy -= (dy / dist) * push;
          }

          this.vx *= 0.94;
          this.vy *= 0.94;

          this.x += this.vx;
          this.y += this.vy;

          if (this.x < -100 || this.x > width + 100 || this.y < -100 || this.y > height + 100) {
            this.reset(false);
          }
        }

        draw(ctxRef, globalHue) {
          const hue = (this.baseHue + globalHue) % 360;
          const alpha = Math.sin((this.age / this.maxLife) * Math.PI) * 0.85;

          ctxRef.strokeStyle = `hsla(${hue}, 95%, 68%, ${alpha})`;
          ctxRef.lineWidth = this.size;
          ctxRef.beginPath();
          ctxRef.moveTo(this.prevX, this.prevY);
          ctxRef.lineTo(this.x, this.y);
          ctxRef.stroke();
        }
      }

      for (let i = 0; i < PARTICLE_COUNT; i++) {
        particles.push(new Particle());
      }

      for (let i = 0; i < RI_COUNT; i++) {
        ribbonTendrils.push({
          phase: (i / RI_COUNT) * Math.PI * 2,
          radiusMult: 0.35 + (i / RI_COUNT) * 0.55,
          freq: 2 + (i % 5),
          hueOffset: (i / RI_COUNT) * 120
        });
      }

      function updatePointer(clientX, clientY) {
        pointer.targetX = clientX;
        pointer.targetY = clientY;
      }

      window.addEventListener('pointermove', function(e) {
        updatePointer(e.clientX, e.clientY);
      }, { passive: true });

      window.addEventListener('pointerdown', function(e) {
        pointer.isDown = true;
        pointer.pulseEnergy = 1.0;
        updatePointer(e.clientX, e.clientY);
      });

      window.addEventListener('pointerup', function() {
        pointer.isDown = false;
      });

      window.addEventListener('touchmove', function(e) {
        if (e.touches && e.touches[0]) {
          updatePointer(e.touches[0].clientX, e.touches[0].clientY);
        }
      }, { passive: true });

      window.addEventListener('touchstart', function(e) {
        pointer.isDown = true;
        pointer.pulseEnergy = 1.0;
        if (e.touches && e.touches[0]) {
          updatePointer(e.touches[0].clientX, e.touches[0].clientY);
        }
      }, { passive: true });

      window.addEventListener('touchend', function() {
        pointer.isDown = false;
      });

      function renderHarmonicRings(cx, cy, t, baseHue) {
        const ringSteps = 120;
        const maxR = Math.min(width, height) * 0.42;

        for (let r = 0; r < ribbonTendrils.length; r++) {
          const rib = ribbonTendrils[r];
          const hue = (baseHue + rib.hueOffset + t * 25) % 360;
          const currentRadius = maxR * rib.radiusMult * (1 + Math.sin(t * 1.5 + rib.phase) * 0.15);

          ctx.beginPath();
          for (let s = 0; s <= ringSteps; s++) {
            const angle = (s / ringSteps) * Math.PI * 2;
            const wave = Math.sin(angle * rib.freq + t * 2.2 + rib.phase) * (18 + pointer.pulseEnergy * 25);
            const totalR = currentRadius + wave;

            const px = cx + Math.cos(angle) * totalR;
            const py = cy + Math.sin(angle) * totalR;

            if (s === 0) {
              ctx.moveTo(px, py);
            } else {
              ctx.lineTo(px, py);
            }
          }
          ctx.closePath();
          ctx.strokeStyle = `hsla(${hue}, 100%, 72%, 0.18)`;
          ctx.lineWidth = 1.2;
          ctx.stroke();
        }
      }

      function render() {
        time += 0.016;

        pointer.x += (pointer.targetX - pointer.x) * 0.08;
        pointer.y += (pointer.targetY - pointer.y) * 0.08;

        if (pointer.pulseEnergy > 0.005) {
          pointer.pulseEnergy *= 0.93;
        } else {
          pointer.pulseEnergy = 0;
        }

        ctx.globalCompositeOperation = 'source-over';
        ctx.fillStyle = 'rgba(0, 0, 0, 0.14)';
        ctx.fillRect(0, 0, width, height);

        const globalHue = (time * 18) % 360;

        ctx.globalCompositeOperation = 'screen';

        const focalGradient = ctx.createRadialGradient(
          pointer.x, pointer.y, 0,
          pointer.x, pointer.y, Math.min(width, height) * 0.6
        );
        focalGradient.addColorStop(0, `hsla(${(globalHue + 40) % 360}, 100%, 60%, 0.15)`);
        focalGradient.addColorStop(0.4, `hsla(${globalHue}, 90%, 50%, 0.05)`);
        focalGradient.addColorStop(1, 'rgba(0, 0, 0, 0)');
        ctx.fillStyle = focalGradient;
        ctx.fillRect(0, 0, width, height);

        renderHarmonicRings(pointer.x, pointer.y, time, globalHue);

        for (let i = 0; i < particles.length; i++) {
          particles[i].update(time, pointer.x, pointer.y, pointer.pulseEnergy);
          particles[i].draw(ctx, globalHue);
        }

        const coreRadius = 4 + Math.sin(time * 6) * 1.5 + pointer.pulseEnergy * 10;
        const coreGlow = ctx.createRadialGradient(
          pointer.x, pointer.y, 0,
          pointer.x, pointer.y, coreRadius * 6
        );
        coreGlow.addColorStop(0, '#ffffff');
        coreGlow.addColorStop(0.3, `hsla(${globalHue}, 100%, 75%, 0.9)`);
        coreGlow.addColorStop(1, 'rgba(0, 0, 0, 0)');

        ctx.fillStyle = coreGlow;
        ctx.beginPath();
        ctx.arc(pointer.x, pointer.y, coreRadius * 6, 0, Math.PI * 2);
        ctx.fill();

        requestAnimationFrame(render);
      }

      window.onload = function() {
        requestAnimationFrame(render);
      };
    })();
  </script>
</body>
</html>
